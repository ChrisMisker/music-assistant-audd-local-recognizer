[project]
name = "music-assistant-audd-local-recognizer"
version = "0.5.1"
description = "Music Assistant audio-analysis provider: AudD discovery + local Panako fingerprints"
requires-python = ">=3.14"
# Runtime requirements are declared in audd_local_recognizer/manifest.json (MA installs them).
dependencies = ["audalign==1.3.2"]

[dependency-groups]
# Local development and tests. Music Assistant itself is deliberately NOT installed:
# the MA-independent modules are unit-tested here, provider.py is compile-checked inside
# the real MA Nightly container by scripts/deploy-to-ma.sh.
dev = [
    "audalign==1.3.2",
    "aiohttp>=3.10",
    "numpy",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::SyntaxWarning",  # pydub (audalign dependency) on Python 3.14
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "TC", "PLC0415", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["audd_local_recognizer", "music_assistant", "conftest"]
